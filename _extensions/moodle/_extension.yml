title: Moodle Private
author: Christian Kraus
version: 1.0.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    moodle-html:
      theme: [cosmo, custom.scss]
      css: drag.css
      include-before-body: header.html
      include-after-body: interactions.js
      toc: true
      number-sections: true
      self-contained: true
      filters:
        - h4-fix.lua
    html:
      theme: [cosmo, custom.scss]
      css: drag.css
      include-before-body: header.html
      include-after-body: interactions.js
      toc: true
      number-sections: true
      self-contained: true
      filters:
        - h4-fix.lua
